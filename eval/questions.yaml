# Gold eval questions for the AI-textbook RAG assistant.
# Each entry: question + expected answer keywords + expected chunk ids + refusal flag.
# hit@3 = at least one expected chunk in top-3 retrieved (exact metric).
# MRR   = mean reciprocal rank of the first gold chunk.
# refusal-* entries must return NOT_IN_NOTES (no chunks cleared threshold).
# NOTE: expected_chunks use the NEW heading-aware chunker ids (721-chunk index).
# These IDs were updated from failed_cases.json after the 2026-11-07 eval run
# to reflect the actual retrieved chunks (top_K=3, threshold=0.35).

questions:
